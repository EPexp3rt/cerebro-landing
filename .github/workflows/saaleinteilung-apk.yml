name: Saaleinteilung APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android 35 installieren
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android Projekt wiederherstellen
        run: |
          cat buildsrc/part*.b64 > android_project.b64
          base64 -d android_project.b64 > android_project.zip
          unzip -q android_project.zip
          test -f Saaleinteilung_App/android/build.gradle

      - name: APK bauen
        run: gradle -p Saaleinteilung_App/android assembleDebug --no-daemon

      - name: APK bereitstellen
        run: |
          cp Saaleinteilung_App/android/app/build/outputs/apk/debug/app-debug.apk Saaleinteilung.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Saaleinteilung.apk
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Saaleinteilung APK aktualisiert [skip ci]"
          git push

      - name: APK als Build speichern
        uses: actions/upload-artifact@v4
        with:
          name: Saaleinteilung APK
          path: Saaleinteilung.apk
